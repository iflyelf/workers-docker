# Cloudflare Workers 配置 - 多功能加速代理
name = "proxy-worker"
main = "workers.js"
compatibility_date = "2026-01-01"

# 默认环境变量（与 workers.js 中 env 对应）
[vars]
# DOH 服务器配置
# DOH = "https://cloudflare-dns.com"
# PATH = "dns-query"  # DoH 路径，也可用作 TOKEN

# 代理配置
# URL = "nginx"  # 返回 nginx 欢迎页
# URL = "https://example.com"  # 反向代理到指定 URL
# URL302 = "https://example.com"  # 302 重定向

# 访问令牌（用于 IP 地理位置查询等需要认证的功能）
# TOKEN = "your-secret-token"

# 生产环境配置示例
[env.production]
# [env.production.vars]
# DOH = "https://cloudflare-dns.com"
# PATH = "dns-query"
# TOKEN = "production-token"

# 开发环境配置示例
# [env.dev.vars]
# TOKEN = "dev-token"
# URL = "nginx"
